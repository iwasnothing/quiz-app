services:
  # -------------------------------------------------------
  # 1. Frontend: Next.js (The "Canvas" UI)
  # -------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # NEXT_PUBLIC_* vars must be available at build time
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://spark-cda3.local:8080}
    container_name: quiz-frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      # API URL configuration
      # Browser needs localhost; Server needs internal docker DNS
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://spark-cda3.local:8080}
      - INTERNAL_API_URL=${INTERNAL_API_URL:-http://spark-cda3.local:8080}
    depends_on:
      - backend

  # -------------------------------------------------------
  # 2. Backend: FastAPI (LangChain Orchestrator)
  # -------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: quiz-backend
    restart: always
    ports:
      - "8080:8080"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      # Mount backend folder for development - changes reflect without rebuild
      - ./backend:/app
      # Exclude node_modules and other build artifacts if any
      - /app/__pycache__
      - /app/.pytest_cache
    # Add extra_hosts to resolve hostname to host machine
    # This allows the container to reach services running on the host or in other containers
    # Option 1: Use host-gateway (Docker Compose 3.8+, automatically resolves to host IP)
    extra_hosts:
      - "spark-cda3.local:host-gateway"
      - "spark-cda3:host-gateway"
    # Option 2: If host-gateway doesn't work, you can also use host.docker.internal
    #   Just change the URLs in .env to use http://host.docker.internal:8000/v1
    #   host.docker.internal is built-in on Mac/Windows Docker Desktop
    env_file:
      - ./backend/.env
    environment:
      # Document processing
      - DOCS_DIR=${DOCS_DIR:-/Users/kahingleung/Downloads/edu-doc/science/ch8}
      - FAISS_DIR=${FAISS_DIR:-/app/faiss_index}
      - SQLITE_DB_PATH=${SQLITE_DB_PATH:-/app/chunks_metadata.db}
      
      # Embeddings configuration
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-/models/google/embeddinggemma-300m}
      - EMBEDDING_BASE_URL=${EMBEDDING_BASE_URL:-http://spark-cda3.local:8001/v1}
      - EMBEDDING_API_KEY=${EMBEDDING_API_KEY:-EMPTY}
      
      # LLM configuration
      - LLM_MODEL=${LLM_MODEL:-/models/Qwen/Qwen3-Omni-30B-A3B-Instruct}
      - LLM_BASE_URL=${LLM_BASE_URL:-http://spark-cda3.local:8000/v1}
      - LLM_API_KEY=${LLM_API_KEY:-EMPTY}
      - LLM_TEMPERATURE=${LLM_TEMPERATURE:-0.7}
      
      # Database configuration (for PostgreSQL/Neo4j if needed)
      # Individual components (used to construct connection string if PG_CONNECTION_STRING not set)
      - POSTGRES_USER=${POSTGRES_USER:-myuser}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-mypassword}
      - POSTGRES_DB=${POSTGRES_DB:-quiz_vector_db}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      # Full connection string (optional - if not set, backend will construct from components above)
      - PG_CONNECTION_STRING=${PG_CONNECTION_STRING:-}
      
      # OpenAI API (if using OpenAI directly)
      - OPENAI_API_KEY=${OPENAI_API_KEY:-EMPTY}
    depends_on:
      - postgres


  # -------------------------------------------------------
  # 3. Localtunnel: Expose frontend to the internet
  # -------------------------------------------------------
  localtunnel:
    build:
      context: ./localtunnel
      dockerfile: Dockerfile
    container_name: quiz-localtunnel
    restart: always
    command: ["lt", "--port", "3000", "--local-host", "localhost"]
    network_mode: "service:frontend"
    depends_on:
      - frontend

  # -------------------------------------------------------
  # 4. Vector Store: Postgres (pgvector)
  # -------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    container_name: pgvector-arm
    restart: always
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-myuser}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-mypassword}
      - POSTGRES_DB=${POSTGRES_DB:-quiz_vector_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d

volumes:
  postgres_data: