services:
  # -------------------------------------------------------
  # 1. Frontend: Next.js (The "Canvas" UI)
  # -------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: quiz-frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      # Browser needs localhost; Server needs internal docker DNS
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - INTERNAL_API_URL=http://backend:8000
    depends_on:
      - backend

  # -------------------------------------------------------
  # 2. Backend: FastAPI (LangChain Orchestrator)
  # -------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: quiz-backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USERNAME=neo4j
      - NEO4J_PASSWORD=password
      - PG_CONNECTION_STRING=postgresql+psycopg://myuser:mypassword@postgres:5432/quiz_vector_db
      - OPENAI_API_KEY=${OPENAI_API_KEY} # Pass from host shell
    depends_on:
      - postgres


  # -------------------------------------------------------
  # 4. Vector Store: Postgres (pgvector)
  # -------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    container_name: pgvector-arm
    restart: always
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=myuser
      - POSTGRES_PASSWORD=mypassword
      - POSTGRES_DB=quiz_vector_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d

volumes:
  postgres_data: